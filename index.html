<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080709">

  <title>Shivam — Portrait in Dots</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="hero">
    <div class="background-word" aria-hidden="true">
      DEVELOPER
    </div>

    <div class="portrait-shadow" aria-hidden="true"></div>

    <canvas
      id="canvas"
      aria-label="Interactive particle portrait of Shivam Kumar"
    ></canvas>

    <div class="controls">
      <button
        id="revealButton"
        type="button"
        disabled
        aria-pressed="false"
      >
        <span id="buttonText">Reveal</span>
        <span aria-hidden="true">↗</span>
      </button>
    </div>

    <div id="loader" role="status">
      <div class="loading-ring"></div>
      <span>Loading portrait</span>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <noscript>
      Please enable JavaScript to view this portrait.
    </noscript>
  </main>
</body>
</html>
